[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-chrome"
version = "0.1.0"
description = "Drive one real, signed-in Chrome from the shell or from Python; every action reports what changed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "minomat180" }]
keywords = ["chrome", "cdp", "browser", "automation", "agent", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/minomat180/agent-chrome"
Issues = "https://github.com/minomat180/agent-chrome/issues"

[project.scripts]
agent-chrome = "agent_chrome._launch:agent_chrome"
agent-chrome-ctl = "agent_chrome._launch:agent_chrome_ctl"
agent-chrome-setup = "agent_chrome.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["python/agent_chrome"]

# The Node CLI, the shell launcher and the skill ship inside the package, in
# the same relative layout as the repo, so the scripts find lib/ and libexec/
# exactly as they do from a checkout.
[tool.hatch.build.targets.wheel.force-include]
"bin" = "agent_chrome/_dist/bin"
"lib" = "agent_chrome/_dist/lib"
"libexec" = "agent_chrome/_dist/libexec"
"skill" = "agent_chrome/_dist/skill"

[tool.hatch.build.targets.sdist]
include = ["bin", "lib", "libexec", "skill", "python", "README.md", "LICENSE", "pyproject.toml"]
